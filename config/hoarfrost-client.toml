#Quality preset: how many flakes, how far they and the snow on the ground are simulated and drawn. Lower it on weak computers.
#Allowed Values: LOW, MEDIUM, HIGH, ULTRA
quality = "HIGH"

[snowfall]
	#Replace the vanilla snowfall with simulated flakes. Off: vanilla snow is drawn.
	enabled = true
	#Multiplier for the number of flakes.
	#Range: 0.1 ~ 3.0
	density = 1.0
	#Snow falling in the middle distance, beyond the simulated flakes.
	distant = true
	#In heavy snow and blizzards, clouds of snow roll low over the land with the wind and the squalls.
	clouds = true
	#In heavy snow and blizzards, a dense stream of light flakes rushes past the face.
	stream = true
	#Particle Rain integration, when Particle Rain is installed: this mod draws the snowfall and Particle Rain the rain, dust, fog and the rest of its particles, blown by the same wind. Off: Particle Rain draws its own snow too and hides this mod's falling snow.
	particleRain = true
	#Living Wind integration, when Living Wind is installed: the snow flies the way its wind blows, and blows harder or softer with it. Off: the falling snow keeps its own wind (server snowdrifts still follow Living Wind).
	livingWind = true

[ground]
	#Snow settles on the ground, roofs, crowns and posts: more in the lee and in hollows, less on windswept ridges, a little under crowns and in cave mouths. Melts near lamps and in warm land.
	cover = true
	#Snow lies on distant land out to the render distance, and on the crowns of trees there (simplified).
	distant = true
	#Snow lies on the leaves in snowy biomes: a cap on the top of the crowns and over their edges.
	snowyLeaves = true
	#Feet press dents into the snow and pack paths.
	footprints = true
	#Gusts, explosions and feet lift powder off the snow; it rises in a cloud and settles slowly.
	powder = true

[atmosphere]
	#How much falling snow closes in the view distance (a heavy blizzard becomes a whiteout). 0 = vanilla fog.
	#Range: 0.0 ~ 2.0
	fog = 1.0
	#A snowy sky is soft and bright instead of the dark grey of rain.
	brightSky = true

[sound]
	#Volume of the wind of snowy weather. Light snow is always silent.
	#Range: 0.0 ~ 2.0
	windVolume = 1.0
	#How much falling snow hushes the sounds of the world outdoors. 0 = off.
	#Range: 0.0 ~ 1.5
	hush = 1.0
	#Footsteps crunch in snow: fresh powder and trodden snow sound different.
	snowSteps = true

